name: Quiver release checks
on:
  pull_request:
    paths:
      - 'services/backend/**'
      - 'render.yaml'
      - '.github/workflows/quiver-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:execution
      - run: npm test -- --maxWorkers=2
      - run: node scripts/ops/preflight.mjs
