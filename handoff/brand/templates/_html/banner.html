<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:"Instrument Serif";src:url("file:///usr/share/fonts/truetype/sand-box/google/Instrument Serif/InstrumentSerif-Regular.ttf")}
@font-face{font-family:"Instrument Serif";font-style:italic;src:url("file:///usr/share/fonts/truetype/sand-box/google/Instrument Serif/InstrumentSerif-Italic.ttf")}
@font-face{font-family:"Geist";font-weight:100 900;src:url("file:///usr/share/fonts/truetype/sand-box/google/Geist/Geist-VariableFont_wght.ttf")}
@font-face{font-family:"Geist Mono";font-weight:100 900;src:url("file:///usr/share/fonts/truetype/sand-box/google/Geist Mono/GeistMono-VariableFont_wght.ttf")}
:root{--bg:#0A0A0B;--bg1:#111113;--bg2:#17171A;--line:#26262B;--line2:#34343B;--text:#F5F3EF;--text2:#B9B4AB;--text3:#8A867F;--cream:#EDE6DA;--amber:#FFB547;--amberPress:#E0952A;--amberDim:#7A5A2B;--up:#8FD3A8;--down:#F2848F;--statusLive:#8FD3A8;--statusPaper:#B7ACE8;--statusError:#F2848F;--statusIdle:#8A867F;}*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);color:var(--text);font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Instrument Serif",serif;font-weight:400}.mono{font-family:"Geist Mono",monospace;font-variant-numeric:tabular-nums}
/* primary button: squared 8px, amber hairline, nock notch on the left edge (not a pill) */
.qbtn{position:relative;display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 14px 0 18px;border-radius:8px;font:500 14px/1 Geist;letter-spacing:-.005em;white-space:nowrap}
.qbtn-p{color:var(--amber);background:rgba(255,181,71,.07);box-shadow:inset 0 0 0 1px rgba(255,181,71,.55)}
.qbtn-p::before{content:"";position:absolute;left:-1px;top:50%;width:7px;height:12px;margin-top:-6px;background:var(--bg);clip-path:polygon(0 0,100% 50%,0 100%);box-shadow:none}
.qbtn-p::after{content:"";position:absolute;left:0;top:50%;width:7px;height:12px;margin-top:-6px;border:0;background:linear-gradient(var(--amber),var(--amber)) 0 0/100% 100%;clip-path:polygon(0 0,100% 50%,0 100%,0 calc(100% - 1.4px),calc(100% - 2.4px) 50%,0 1.4px);opacity:.55}
.qbtn-p svg{width:12px;height:12px}
.qbtn-g{color:var(--text);box-shadow:inset 0 0 0 1px var(--line2);font-family:"Geist Mono";font-size:13px;padding:0 14px}
em{font-style:italic;font-family:"Instrument Serif",serif}.qn{position:absolute;background:linear-gradient(180deg,#151517,#111113);border:1px solid var(--line);border-radius:12px;padding:12px 14px 13px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -12px rgba(0,0,0,.6);
 --ping:0;border-color:color-mix(in srgb,var(--amber) calc(var(--ping)*55%),var(--line))}
.qn-k{font:500 10.5px/1 "Geist Mono";letter-spacing:.08em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:7px}
.qn-k i{width:6px;height:6px;border-radius:50%;background:var(--text3);box-shadow:0 0 0 calc(var(--ping)*5px) rgba(255,181,71,calc(var(--ping)*.18))}
.qn-trigger .qn-k i{background:var(--cream)} /* amber is accent-only: node-kind dots stay neutral */
.qn-action.live .qn-k i{background:var(--statusLive)} .qn-action.paper .qn-k i{background:var(--statusPaper)}
.qn-t{font:500 14px/1.3 Geist;color:var(--text);margin-top:9px;letter-spacing:-.005em}
.qn-v{margin-top:8px;font-size:20px;color:var(--cream);letter-spacing:-.02em}.qn-v .u{font-size:12px;color:var(--text3);margin-left:4px}
.qn-s{margin-top:7px;font-size:11.5px;color:var(--text3)}
.qe{fill:none;stroke:#2E2E34;stroke-width:1.25}
.qe-lit{fill:none;stroke:var(--amber);stroke-width:1.25;opacity:0}
.qa-tail{fill:none;stroke:var(--amber);stroke-width:1.6;stroke-linecap:round}
.qa-head{fill:var(--amber)}
.qport{fill:var(--bg);stroke:#5A5650;stroke-width:1.25}
/* marketing images: bigger node type, no status pastels */
.mkt .qn{height:124px} .mkt .qn-k{font-size:13px} .mkt .qn-t{font-size:17px} .mkt .qn-v{font-size:26px} .mkt .qn-s{font-size:14px}
.mkt .qn-k i{background:var(--text3)!important} .mkt .qn-trigger .qn-k i{background:var(--cream)!important}
body{width:1500px;height:500px;overflow:hidden;position:relative}
.hair{position:absolute;inset:0;background:radial-gradient(900px 420px at 78% 50%,rgba(255,181,71,.055),transparent 70%)}
.copy{position:absolute;left:290px;top:110px;width:480px}
.lab{font:500 15px/1 "Geist Mono";letter-spacing:.12em;color:var(--text3);text-transform:uppercase;display:flex;gap:14px;align-items:center}
.lab b{color:var(--amber);font-weight:500}
h1{font:400 70px/1 "Instrument Serif";letter-spacing:-.02em;margin-top:22px;color:var(--text)}
h1 em{color:var(--cream)}
p.s{margin-top:20px;font:400 19px/1.45 Geist;color:var(--text2);letter-spacing:-.005em}
#g{position:absolute;left:770px;top:136px;transform:scale(1.0);transform-origin:0 0}
</style></head><body><div class="hair"></div>
<div class=copy><div class=lab><span>Quiver</span><b>$QUIVR</b><span>· Robinhood Chain</span></div>
<h1>Every strategy<br>is an <em>arrow.</em></h1>
<p class=s>Describe a trade in plain English. Quiver turns it into a live graph you can paper trade, backtest and run.</p></div>
<div id=g class=mkt></div>
<script>// Quiver live graph: orthogonal edges, light-arrows travel along them. Deterministic: render(tMs).
(function(){
const NS='http://www.w3.org/2000/svg';
window.QGraph=function(root,opts){
  const W=opts.w,H=opts.h,nodes=opts.nodes,edges=opts.edges,P=opts.period||6000;
  root.style.position='relative';root.style.width=W+'px';root.style.height=H+'px';
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('width',W);svg.setAttribute('height',H);svg.style.position='absolute';svg.style.inset=0;root.appendChild(svg);
  const el={};
  nodes.forEach(n=>{const d=document.createElement('div');d.className='qn qn-'+n.kind;d.style.left=n.x+'px';d.style.top=n.y+'px';d.style.width=(n.w||190)+'px';
    d.innerHTML=`<div class="qn-k"><i></i>${n.label}</div><div class="qn-t">${n.title}</div>`+(n.val!==undefined?`<div class="qn-v mono"><span class="v">${n.val}</span><span class="u">${n.unit||''}</span></div>`:'')+(n.sub?`<div class="qn-s mono">${n.sub}</div>`:'');
    root.appendChild(d);el[n.id]={n,d};});
  const port=(id,side)=>{const {n,d}=el[id];const w=n.w||190,h=d.offsetHeight;return side==='out'?[n.x+w,n.y+h/2]:[n.x,n.y+h/2];};
  const E=edges.map(e=>{const [x1,y1]=port(e.from,'out'),[x2,y2]=port(e.to,'in');const mx=e.mx!==undefined?e.mx:(x1+x2)/2;const r=Math.min(12,Math.abs(y2-y1)/2);const s=Math.sign(y2-y1);
    const d=Math.abs(y2-y1)<1?`M${x1} ${y1}H${x2}`:`M${x1} ${y1}H${mx-r}Q${mx} ${y1} ${mx} ${y1+s*r}V${y2-s*r}Q${mx} ${y2} ${mx+r} ${y2}H${x2}`;
    const base=document.createElementNS(NS,'path');base.setAttribute('d',d);base.setAttribute('class','qe');svg.appendChild(base);
    const lit=document.createElementNS(NS,'path');lit.setAttribute('d',d);lit.setAttribute('class','qe-lit');svg.appendChild(lit);
    const tails=[0.18,0.42,1].map((o,i)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','qa-tail');p.style.opacity=o;svg.appendChild(p);return p;});
    const head=document.createElementNS(NS,'path');head.setAttribute('d','M-7 -4.5 L1.5 0 L-7 4.5 L-5 0 Z');head.setAttribute('class','qa-head');svg.appendChild(head);
    const dot=document.createElementNS(NS,'circle');dot.setAttribute('r',3);dot.setAttribute('class','qport');dot.setAttribute('cx',x2);dot.setAttribute('cy',y2);svg.appendChild(dot);
    const dot2=document.createElementNS(NS,'circle');dot2.setAttribute('r',3);dot2.setAttribute('class','qport');dot2.setAttribute('cx',x1);dot2.setAttribute('cy',y1);svg.appendChild(dot2);
    return {e,base,lit,tails,head,dot,len:base.getTotalLength()};});
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; // power2.inOut
  function render(t){
    t=((t%P)+P)%P;
    E.forEach(o=>{const {e,len}=o;const a=e.t0,b=e.t1;let k=(t-a)/(b-a);
      const on=k>=0&&k<=1;const pos=ease(Math.max(0,Math.min(1,k)))*len;
      [26,14,6].forEach((L,i)=>{const p=o.tails[i];if(!on){p.style.visibility='hidden';return;}p.style.visibility='visible';const l=Math.min(L*2.2,pos);p.setAttribute('stroke-dasharray',`${l} ${len+100}`);p.setAttribute('stroke-dashoffset',-(pos-l));});
      if(on){const q=o.base.getPointAtLength(pos),q0=o.base.getPointAtLength(Math.max(0,pos-1.5));const ang=Math.atan2(q.y-q0.y,q.x-q0.x)*180/Math.PI;o.head.style.visibility='visible';o.head.setAttribute('transform',`translate(${q.x} ${q.y}) rotate(${ang})`);}else o.head.style.visibility='hidden';
      // edge glow stays briefly after arrival
      const after=(t-b)/700; const lit=on?0.35*k:(after>=0&&after<1?0.35*(1-after):0);o.lit.style.opacity=lit;
      const ping=(after>=0&&after<1)?1-after:0;o.dot.style.opacity=0.35+0.65*ping;o.dot.setAttribute('r',3+ping*1.5);
      const tgt=el[e.to].d;tgt.style.setProperty('--ping',Math.max(+tgt.dataset.p||0,ping));tgt.dataset.p=Math.max(+tgt.dataset.p||0,ping);
    });
    Object.values(el).forEach(({n,d})=>{d.style.setProperty('--ping',d.dataset.p||0);d.dataset.p=0;
      if(n.live){const v=n.live(t/P);const s=d.querySelector('.v');if(s)s.textContent=v;}});
  }
  return {render,period:P};
};
})();

const G=QGraph(document.getElementById('g'),{w:680,h:228,period:6000,nodes:[{"id": "s", "kind": "signal", "label": "Signal", "title": "HOOD \u00b7 RSI 14 \u00b7 1h", "val": "28.6", "x": 0, "y": 104, "w": 200},{"id": "t", "kind": "trigger", "label": "Trigger", "title": "RSI under 30", "sub": "checks every block", "x": 240, "y": 52, "w": 200},{"id": "a", "kind": "action", "label": "Action", "title": "Buy $500 of HOOD", "sub": "take profit +8%", "x": 480, "y": 0, "w": 200}],edges:[{from:'s',to:'t',t0:0,t1:1600},{from:'t',to:'a',t0:900,t1:2700}]});
G.render(1150);</script></body></html>
